[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qnx-buildfile-lint"
version = "1.0.0"
description = "Host linter/validator for QNX mkifs buildfiles and QNX IFS images (QNX SDP 8.0)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Gemma Works", email = "gemmahadi@gmail.com" }]
requires-python = ">=3.8"
keywords = ["qnx", "mkifs", "ifs", "buildfile", "linter", "embedded", "rtos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Boot",
]

[project.urls]
Homepage = "https://github.com/gemmaworks/qnx-buildfile-lint"
Repository = "https://github.com/gemmaworks/qnx-buildfile-lint"

[project.scripts]
qnx-buildfile-lint = "qnx_buildfile_lint.cli:main"

[tool.setuptools]
packages = ["qnx_buildfile_lint"]
